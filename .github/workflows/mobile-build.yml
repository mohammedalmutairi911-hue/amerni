name: Mobile build (Android APK + iOS check)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'package.json'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://urgqapqkbwhornmgqaav.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MRF8O_JGMHiqF2c9R4XrLA_YuUF8U0I
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: amerni-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # رابط تنزيل مباشر لملف التجربة (يتحدّث مع كل بناء)
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk amerni-android.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest amerni-android.apk --prerelease --title "أمرني — نسخة تجربة أندرويد" --notes "ملف APK للتجربة فقط. حمّله على جوال أندرويد وافتحه."

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://urgqapqkbwhornmgqaav.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MRF8O_JGMHiqF2c9R4XrLA_YuUF8U0I
      - run: npx cap sync ios
      # فحص أن المشروع يُبنى (بدون توقيع). النشر على App Store يحتاج حساب Apple Developer.
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
